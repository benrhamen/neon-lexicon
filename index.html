function shuffleLetters(){let next=tileOrder;for(let tries=0;tries<20&&next===tileOrder;tries++){const a=tileOrder.split('');for(let i=4;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}next=a.join('');}if(next===tileOrder)next=tileOrder.slice(1)+tileOrder[0];tileOrder=next;document.querySelectorAll('[data-letter]').forEach((b,i)=>{b.dataset.letter=tileOrder[i];b.textContent=tileOrder[i].toUpperCase();if(phase==='play')b.onclick=()=>{$('#word').value+=b.dataset.letter;$('#word').focus();};});if(phase==='play')$('#word').focus();}
function finish(all){if(phase!=='play')return;clearInterval(ticker);phase='done';const result={review:null,all,expired:duration>0,draw,found:found.length,total:answers.length,svg:svg(),missed:answers.filter(w=>!found.includes(w))};entries.push({draw,duration,name:name.trim().slice(0,24)||'Anonymous',found:found.length,total:answers.length,at:Date.now()});entries=entries.slice(-60);try{localStorage.setItem(KEY,JSON.stringify(entries));storage=true;}catch{storage=false;}randomDraw();lastResult=result;render();window.scrollTo({top:0,behavior:'instant'});}
