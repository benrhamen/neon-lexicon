const $=s=>document.querySelector(s),escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const masks=WORDS.map(word=>({word,mask:[...word].reduce((m,c)=>m|1<<(c.charCodeAt(0)-97),0)}));
const pool=d=>{const m=[...d].reduce((m,c)=>m|1<<(c.charCodeAt(0)-97),0);return masks.filter(x=>(x.mask&m)===x.mask).map(x=>x.word)};
const normalized=d=>[...new Set(d.toLowerCase())].sort().join('');
const motifs=['planet','diamond','lightning','rocket'];
let tileOrder='aerst',lastResult=null;

try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(data))entries=data.filter(e=>typeof e.draw==='string'&&/^[a-z]{5}$/.test(e.draw)&&[0,60,120,300].includes(e.duration)&&typeof e.name==='string'&&Number.isInteger(e.found)&&Number.isInteger(e.total)&&e.total>0&&e.found>=0&&e.found<=e.total&&Number.isFinite(e.at)).slice(-60);localStorage.setItem(KEY,JSON.stringify(entries));}catch{storage=false;}
const pct=(f,t)=>t?100*f/t:0,time=()=>duration===0?'∞':left>=60?Math.floor(left/60)+':'+String(left%60).padStart(2,'0'):String(left).padStart(2,'0');
function makePixels(n,k){let side=4,points=[];function inside(x,y){if(k===0)return x*x+y*y<.37||Math.abs(y-.32*x)<.09&&x*x+y*y<.88;if(k===1)return Math.abs(x)+Math.abs(y)<.95;if(k===2)return y<.05&&x>-.3&&x<.28+.45*y||y>=-.1&&x>-.28+.45*y&&x<.22;return Math.abs(x)<.24&&y>-.5&&y<.55||y<=-.5&&Math.abs(x)<(y+1)*.5||y>.1&&y<.6&&Math.abs(x)<.5-y*.25||y>.58&&y<.95&&Math.abs(x)<.15*(1-(y-.58)/.37);}
while(points.length<n){side++;points=[];for(let y=0;y<side;y++)for(let x=0;x<side;x++){if(inside((x+.5)/side*2-1,(y+.5)/side*2-1))points.push({x,y,rank:Math.sin(x*127.1+y*311.7+k*77)*43758.5453%1});}}

let art=makePixels(answers.length,kind);
function svg(){return `<svg role="img" aria-label="${motifs[kind]} drawing, ${found.length} of exactly ${answers.length} pixels lit" viewBox="0 0 ${art.side} ${art.side}" shape-rendering="crispEdges">${art.points.map((p,i)=>`<rect data-pixel="true" data-lit="${i<found.length}" x="${p.x+.07}" y="${p.y+.07}" width=".86" height=".86" fill="${i<found.length?(i%7===0?'#ffac62':'#72efff'):'#1b394a'}"/>`).join('')}</svg>`;}
function render(){
$('#app').innerHTML=`${phase==='play'?'':`<header><h1>Neon Lexicon</h1><p>5 letters. Your timer. One circuit.</p></header><div class="subtitle">Find as many English words as you can. Reuse any letter.</div>`}
<div class="topline"><span>${phase==='play'?'CIRCUIT LIVE':phase==='done'?(complete?'LEGEND!!!':'ROUND COMPLETE'):'READY TO CONNECT'}</span><div class="topactions"><button class="quiet" id="shuffle" aria-label="Shuffle current letters">Shuffle ↻</button><button class="quiet" id="rules" aria-expanded="${showRules}">Rules ${showRules?'−':'+'}</button></div></div>
${showRules?`<section class="rules"><h2>Your circuit</h2><p>Use only the five different letters shown. Reuse any letter as often as you like; you do not have to use all five. Words need at least 3 letters. Listed plurals and verb forms count. Each unique word counts once.</p><p>Percentage = words found / all accepted words for this draw × 100. English ENABLE dictionary, including uncommon words. It is a fixed word-game list, not every possible English word.</p><p>Timer choices: 1, 2 or 5 minutes, or unlimited. A round ends at zero or when every possible word is found. Unlimited also has a voluntary Finish button.</p><p>Your personal rankings combine all draws and timers. Different draws have different difficulty. Scores remain in this browser, not shared with other players. Clearing site data removes them.</p></section>`:''}
<div class="playcontrols"><div class="tiles" aria-label="Letters ${draw.toUpperCase()}">${[...tileOrder].map(c=>`<button class="tile" data-letter="${c}" ${phase==='play'?'':'disabled'}>${c.toUpperCase()}</button>`).join('')}</div>
${phase==='play'?`<form class="entry" id="entry"><label for="word">ENTER A WORD</label><div><input id="word" placeholder="Type or tap letters" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="go"><button type="submit" class="primary">Add</button></div><div class="editing">${duration===0?'<button type="button" class="quiet" id="finish">Finish round</button>':''}<button type="button" class="quiet" id="back">⌫ Backspace</button><button type="button" class="quiet" id="clear">Clear</button><button type="button" class="quiet" id="reset">Reset</button></div></form>`:''}</div>
${lastResult&&phase==='ready'?`<section class="lastresult" role="status"><strong>${lastResult.all?'Congratulations, LEGEND!!!':lastResult.expired?'Time is up. Round complete.':'Round complete.'}</strong><p>${lastResult.draw.toUpperCase()} · ${lastResult.found}/${lastResult.total} words · ${pct(lastResult.found,lastResult.total).toFixed(1)}%. A fresh draw is ready.</p><details><summary>Previous circuit & missed words</summary><div class="pixelpanel">${lastResult.svg}</div><div class="chips missed">${lastResult.missed.map(w=>`<span>${w}</span>`).join('')}</div></details></section>`:''}
<div class="metrics"><div><small>TIME LEFT</small><strong id="clock" class="${duration>0&&left<=10?'urgent':''}">${time()}</strong></div><div><small>FOUND / POSSIBLE</small><strong>${found.length}<span> / ${answers.length}</span></strong></div><div><small>THIS DRAW</small><strong>${pct(found.length,answers.length).toFixed(1)}<span>%</span></strong></div></div>
<section class="pixelpanel"><div class="pixelheading"><span>${motifs[kind].toUpperCase()} CIRCUIT</span><span>${found.length} / ${answers.length} pixels lit</span></div>${svg()}<p>One accepted word lights one pixel.</p></section><div class="timebar"><div id="timefill" style="width:${duration===0?100:left/duration*100}%"></div></div>
${phase==='ready'?`<div class="launch"><fieldset class="timers"><legend>Round timer</legend>${[[60,'1 min'],[120,'2 min'],[300,'5 min'],[0,'Unlimited']].map(([n,label])=>`<button data-timer="${n}" aria-pressed="${duration===n}">${label}</button>`).join('')}</fieldset><label for="player">Player name <span>(optional)</span></label><input id="player" maxlength="24" placeholder="Your name" value="${escape(name)}"><button class="primary" id="start">Start ${duration===0?'unlimited':duration/60+'-minute'} round <span>↗</span></button><div class="drawtools"><button class="secondary" id="new">New draw</button><input id="code" aria-label="Five-letter draw code" maxlength="5" placeholder="ABCDE"><button class="secondary" id="load">Load</button></div><p class="fine">Random draws have at least 15 possible words. Load five letters to replay a specific circuit.</p></div>`:''}

<p class="status" role="status">${escape(message||'Each found word lights one pixel.')}</p>
${found.length||phase==='play'?`<section class="found"><h2>Words found <span>${found.length}</span></h2><div class="chips">${found.length?found.map(w=>`<span>${w}</span>`).join(''):'<p>Build your first word.</p>'}</div></section>`:''}
${phase==='done'?`<section class="result"><h2>${complete?'Congratulations, LEGEND!!!':pct(found.length,answers.length).toFixed(1)+'% of this circuit'}</h2><p>${complete?'You found every possible word. The whole drawing is lit.':found.length+' of '+answers.length+' accepted words found.'}</p><div class="actions"><button class="primary" id="replay">Replay this draw</button><button class="secondary" id="new">New draw</button></div><button class="quiet answers-toggle" id="missed">${showAnswers?'Hide':'Show'} missed words (${answers.length-found.length})</button>${showAnswers?`<div class="chips missed">${answers.filter(w=>!found.includes(w)).map(w=>`<span>${w}</span>`).join('')}</div>`:''}</section>`:''}
${phase!=='play'?`<section class="leaderboard"><div class="sectionhead"><h2>Your percentage rankings</h2><span>THIS DEVICE</span></div><p class="fine">All draws and timer modes. Different draws have different difficulty.</p>${entries.length?`<ol>${[...entries].sort((a,b)=>pct(b.found,b.total)-pct(a.found,a.total)||a.at-b.at).slice(0,15).map((e,i)=>`<li><span class="rank">${i+1}</span><span>${escape(e.name)}<small>${e.draw.toUpperCase()} · ${e.duration===0?'Unlimited':e.duration/60+' min'} · ${e.found}/${e.total}</small></span><strong>${pct(e.found,e.total).toFixed(1)}%</strong></li>`).join('')}</ol>`:'<p class="empty">Finish a round to add your first percentage.</p>'}<p class="fine">${storage?'Saved in this browser only.':'Storage unavailable. Rankings last only while this page is open.'}</p></section><details class="credits"><summary>Dictionary & score details</summary><p>ENABLE word list, credited to M. Cooper and Alan Beale. Public-domain word-game data. All qualifying source words of 3+ letters and at most five distinct letters are included. Score is calculated at full precision and displayed to one decimal.</p><p>Dictionary fingerprint: ${VERSION}. ${WORDS.length} eligible words. Personal practice rankings are not verified competitive records. Unlimited and replay can produce higher percentages than short rounds.</p><a target="_blank" rel="noreferrer" href="https://github.com/dolph/dictionary">Dictionary source</a><a target="_blank" rel="noreferrer" href="https://raw.githubusercontent.com/kevina/wordlist/master/scowl/Copyright">ENABLE permission and attribution</a></details>`:''}
<footer>English only · Draw-specific percentage · Browser-local rankings</footer>`;
$('#shuffle').onclick=shuffleLetters;$('#rules').onclick=()=>{const typed=$('#word')?.value;showRules=!showRules;render();if($('#word'))$('#word').value=typed||'';};
if(phase==='ready'){$('#player').oninput=e=>name=e.target.value;$('#start').onclick=start;$('#load').onclick=load;document.querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>{duration=Number(b.dataset.timer);left=duration;render();});}
if($('#new'))$('#new').onclick=randomDraw;
if(phase==='play'){$('#reset').onclick=()=>{prepare(draw);window.scrollTo({top:0,behavior:'instant'});};$('#entry').onsubmit=e=>{e.preventDefault();submit();};$('#back').onclick=()=>{$('#word').value=$('#word').value.slice(0,-1);$('#word').focus();};$('#clear').onclick=()=>{$('#word').value='';$('#word').focus();};if($('#finish'))$('#finish').onclick=()=>finish(false);document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{$('#word').value+=b.dataset.letter;$('#word').focus();});}
if(phase==='done'){$('#replay').onclick=()=>{prepare(draw);start();};$('#missed').onclick=()=>{showAnswers=!showAnswers;render();};}
}
function prepare(d){clearInterval(ticker);draw=d;tileOrder=d;lastResult=null;answers=pool(d);found=[];phase='ready';left=duration;message='';complete=false;showAnswers=false;kind=Math.floor(Math.random()*4);art=makePixels(answers.length,kind);render();}
function randomDraw(){const chars='abcdefghijklmnopqrstuvwxyz';for(let i=0;i<1000;i++){const a=chars.split('');for(let j=25;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]];}const d=a.slice(0,5).sort().join('');if(d!==draw&&/[aeiouy]/.test(d)&&pool(d).length>=15){prepare(d);return;}}prepare(draw==='aerst'?'aeost':'aerst');}
function load(){const code=$('#code').value.toLowerCase();if(!/^[a-z]{5}$/.test(code)||new Set(code).size!==5){message='Enter exactly five different A-Z letters.';$('.status').textContent=message;return;}const d=normalized(code);if(pool(d).length===0){message='That draw has no qualifying words. Try another.';$('.status').textContent=message;return;}prepare(d);}
function start(){found=[];phase='play';complete=false;message='';deadline=duration===0?Infinity:Date.now()+duration*1000;left=duration;render();$('#word').focus();if(duration>0)ticker=setInterval(tick,100);window.scrollTo({top:0,behavior:'instant'});}
function tick(){if(phase!=='play'||duration===0)return;left=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(left===0){finish(false);return;}$('#clock').textContent=time();$('#clock').classList.toggle('urgent',left<=10);$('#timefill').style.width=left/duration*100+'%';}
function submit(){if(phase!=='play')return;if(Date.now()>=deadline){finish(false);return;}const w=$('#word').value.trim().toLowerCase();if(!/^[a-z]{3,}$/.test(w))message='Use an English word with at least 3 letters.';else if([...w].some(c=>!draw.includes(c)))message='Use only the five letters in this draw.';else if(!answers.includes(w))message="Not in this game's fixed dictionary.";else if(found.includes(w))message='Already found. Try another word.';else{found.push(w);message=w.toUpperCase()+' accepted';if(found.length===answers.length){finish(true);return;}$('#word').value='';$('#word').focus();document.querySelector('.metrics>div:nth-child(2) strong').innerHTML=found.length+'<span> / '+answers.length+'</span>';document.querySelector('.metrics>div:nth-child(3) strong').innerHTML=pct(found.length,answers.length).toFixed(1)+'<span>%</span>';document.querySelector('.pixelpanel svg').outerHTML=svg();document.querySelector('.pixelheading span:last-child').textContent=found.length+' / '+answers.length+' pixels lit';document.querySelector('.found h2 span').textContent=found.length;document.querySelector('.chips').innerHTML=found.map(w=>'<span>'+w+'</span>').join('');$('.status').textContent=message;return;}$('.status').textContent=message;$('#word').value='';$('#word').focus();}
function shuffleLetters(){let next=tileOrder;for(let tries=0;tries<20&&next===tileOrder;tries++){const a=tileOrder.split('');for(let i=4;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}next=a.join('');}if(next===tileOrder)next=tileOrder.slice(1)+tileOrder[0];tileOrder=next;document.querySelectorAll('[data-letter]').forEach((b,i)=>{b.dataset.letter=tileOrder[i];b.textContent=tileOrder[i].toUpperCase();if(phase==='play')b.onclick=()=>{$('#word').value+=b.dataset.letter;$('#word').focus();};});if(phase==='play')$('#word').focus();}
function finish(all){if(phase!=='play')return;clearInterval(ticker);phase='done';const result={all,expired:duration>0,draw,found:found.length,total:answers.length,svg:svg(),missed:answers.filter(w=>!found.includes(w))};entries.push({draw,duration,name:name.trim().slice(0,24)||'Anonymous',found:found.length,total:answers.length,at:Date.now()});entries=entries.slice(-60);try{localStorage.setItem(KEY,JSON.stringify(entries));storage=true;}catch{storage=false;}randomDraw();lastResult=result;render();window.scrollTo({top:0,behavior:'instant'});}

document.addEventListener('visibilitychange',tick);render();
